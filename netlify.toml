[build]
  command = "npm install"

# Netlify Functions（Node 运行时）- 取代原 Edge Functions 配置
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 同步函数超时上限：Pro/Enterprise 计划最大 26 秒，免费 Hobby 计划上限 10 秒。
# 上传附件（OSS PUT + 状态轮询）耗时较长，必须保留足够余量。
[[functions]]
  path = "api.js"
  timeout = 26

# 将 API 与页面路由重写到 Functions 入口
[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

# /chat 页面直接由仓库根目录的 chat.html 静态文件提供
# （函数环境读不到 chat.html，走函数会 ENOENT）
# 注意：不能用 "/chat/*" 通配——它会连 /chat.html 自己也匹配上，造成重定向循环。
[[redirects]]
  from = "/chat"
  to = "/chat.html"
  status = 200
  force = true

[[redirects]]
  from = "/chat/"
  to = "/chat.html"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200
  force = true
